[project]
name = "gridiron-edge"
version = "0.1.0"
description = "Finds +EV football bets on Kalshi/PrizePicks and tracks a paper bankroll"
requires-python = ">=3.14,<3.15"
dependencies = [
    "textual==8.2.8",
    "textual-plotext==1.0.1",
    "plotext==5.3.2",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "aiolimiter==1.3.0",
    "nflreadpy==0.1.5",
    "polars==2.0.0",
    "pyarrow==26.0.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "penaltyblog==1.13.1",
]

[project.scripts]
gridiron-edge = "gridiron_edge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridiron_edge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
